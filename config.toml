[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 10

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[theme]
base = "dark"
backgroundColor = "#111418"
secondaryBackgroundColor = "#181c22"
textColor = "#f0f4f8"
font = "sans serif"
